<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block Miner Clicker</title>
<meta name="description" content="Jogo idle clicker de mineração com estética pixel art. Quebre blocos, colete recursos, compre upgrades e suba de patente.">
<meta name="theme-color" content="#0d0b08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BlockMiner">
<meta name="application-name" content="BlockMiner">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#c6c6c6; --panel-dark:#8b8b8b; --panel-light:#ffffff; --panel-shadow:#373737;
    --ink:#2b2b2b; --gold:#f6d32d; --accent:#5b8f3b; --danger:#b3160c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{ margin:0; padding:0; width:100%; height:100%; background:#0d0b08; font-family:'Press Start 2P', monospace; overflow:hidden; touch-action:manipulation; }
  #app{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #gameContainer{
    position:relative; width:100%; max-width:480px; height:100%; max-height:900px;
    aspect-ratio:9/16; background:#0d0b08; border-left:4px solid #000; border-right:4px solid #000; overflow:hidden;
  }
  #gameCanvas{
    position:absolute; top:0; left:0; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; display:block;
  }
  #hud{ position:absolute; top:0; left:0; right:0; padding:8px 8px 0; display:flex; flex-direction:column; gap:5px; pointer-events:none; z-index:5; }
  .pixel-panel{
    background:var(--panel);
    border-top:3px solid var(--panel-light); border-left:3px solid var(--panel-light);
    border-bottom:3px solid var(--panel-shadow); border-right:3px solid var(--panel-shadow);
    color:var(--ink); padding:6px 8px; font-size:9px; line-height:1.6;
  }
  #resourceRow{display:flex; justify-content:space-between; align-items:center;}
  #resourceDisplay{color:#1a5c1a; font-size:12px;}
  #rankBadge{display:flex; align-items:center; gap:4px; font-size:7px;}
  #rankBadge span{padding:2px 4px; border:1px solid #000;}
  #idleTierRow{display:flex; justify-content:space-between; font-size:7px; color:#444; gap:4px;}
  #idleTierRow span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #comboBarWrap{ position:absolute; top:92px; left:8px; right:8px; height:8px; background:#000; border:2px solid #000; z-index:5; }
  #comboBar{ height:100%; width:0%; background:linear-gradient(90deg,#ffcc00,#ff5500); transition:width 0.08s linear; }
  #bottomNav{ position:absolute; bottom:8px; left:8px; right:8px; display:flex; gap:5px; z-index:5; }
  .mc-btn{
    flex:1; background:var(--panel);
    border-top:3px solid var(--panel-light); border-left:3px solid var(--panel-light);
    border-bottom:3px solid var(--panel-shadow); border-right:3px solid var(--panel-shadow);
    color:var(--ink); font-family:'Press Start 2P', monospace; font-size:7.5px; padding:11px 2px; text-align:center; cursor:pointer;
  }
  .mc-btn:active{
    border-top:3px solid var(--panel-shadow); border-left:3px solid var(--panel-shadow);
    border-bottom:3px solid var(--panel-light); border-right:3px solid var(--panel-light);
  }
  .mc-btn, .st-tab{ position:relative; }
  .badge{
    position:absolute; top:-5px; right:-5px;
    min-width:16px; height:16px; z-index:15;
    background:#f6d32d; border:2px solid #000;
    font-size:6px; font-family:'Press Start 2P',monospace;
    color:#3a2a00; line-height:12px; text-align:center;
    display:none; align-items:center; justify-content:center; padding:0 3px;
  }
  .badge.show{ display:flex; }
  #eventBanner{
    position:absolute; top:132px; left:8px; right:8px; z-index:6;
    padding:6px 8px; font-size:8px; text-align:center;
    display:none; pointer-events:none;
  }
  #eventBanner .ev-name{ font-size:9px; font-weight:bold; }
  #eventBanner .ev-timer{ font-size:11px; margin-top:2px; }

  #installBanner{
    position:absolute; left:8px; right:8px; bottom:52px; z-index:6;
    display:none; align-items:center; gap:6px;
    background:var(--gold); color:#3a2a00;
    border-top:3px solid #fff6c0; border-left:3px solid #fff6c0;
    border-bottom:3px solid #a88b00; border-right:3px solid #a88b00;
    font-size:7px; line-height:1.6; padding:7px 8px; pointer-events:auto;
  }
  #installBanner .ib-text{ flex:1; }
  #installBanner .ib-btn{
    background:var(--panel); color:var(--ink);
    border-top:3px solid var(--panel-light); border-left:3px solid var(--panel-light);
    border-bottom:3px solid var(--panel-shadow); border-right:3px solid var(--panel-shadow);
    font-family:'Press Start 2P', monospace; font-size:7px; padding:7px 8px; cursor:pointer; white-space:nowrap;
  }
  #installBanner .ib-btn:active{
    border-top:3px solid var(--panel-shadow); border-left:3px solid var(--panel-shadow);
    border-bottom:3px solid var(--panel-light); border-right:3px solid var(--panel-light);
  }
  #installBanner .ib-close{
    background:var(--danger); color:#fff; border:2px solid #000;
    width:20px; height:20px; line-height:16px; text-align:center; cursor:pointer; font-size:9px; padding:0;
  }

  .sheet-header{ display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:3px solid var(--panel-shadow); font-size:10px; }
  .sheet-header .close-x{ background:var(--danger); color:#fff; border:2px solid #000; width:22px; height:22px; text-align:center; line-height:20px; cursor:pointer; font-size:10px; }
  .tabs{display:flex; gap:3px; padding:8px 8px 0;}
  .tab-btn{ flex:1; font-family:'Press Start 2P', monospace; font-size:6.5px; padding:8px 1px; cursor:pointer; background:var(--panel-dark); color:#eee; border:2px solid var(--panel-shadow); }
  .tab-btn.active{background:var(--gold); color:#3a2a00;}
  #shopList, #prestigeContent, #offlineContent, #collectionGrid{ padding:10px; overflow-y:auto; font-size:8px; }

  .upgrade-card{
    display:flex; align-items:center; gap:8px; background:#dcdcdc;
    border-top:2px solid #fff; border-left:2px solid #fff; border-bottom:2px solid #6b6b6b; border-right:2px solid #6b6b6b;
    padding:8px; margin-bottom:8px;
  }
  .upgrade-icon{ width:32px; height:32px; flex:none; border:2px solid #000; background:#1c1c1c; display:flex; align-items:center; justify-content:center; }
  .upgrade-icon canvas{ width:28px; height:28px; image-rendering:pixelated; }
  .upgrade-info{flex:1; line-height:1.7; min-width:0;}
  .upgrade-info .u-name{font-size:8.5px; color:#1a1a1a;}
  .upgrade-info .u-desc{font-size:6.8px; color:#555;}
  .upgrade-info .u-level{font-size:6.8px; color:#7a3ba0;}
  .buy-btn{
    font-family:'Press Start 2P', monospace; font-size:6.8px; padding:8px 5px; white-space:nowrap;
    background:var(--accent); color:#fff;
    border-top:2px solid #8fd15f; border-left:2px solid #8fd15f; border-bottom:2px solid #2f4f1f; border-right:2px solid #2f4f1f;
    cursor:pointer;
  }
  .buy-btn:disabled{ background:#8a8a8a; color:#ccc; cursor:default; border-color:#aaa #555 #555 #aaa; }
  .buy-btn.locked{ background:#555; color:#999; }
  .buy-btn.equipped{ background:#3a6fd8; color:#fff; }

  #prestigeContent p, #offlineContent p{margin:0 0 10px; line-height:1.8;}
  #prestigeConfirm{width:100%; margin-top:6px;}
  #rankProgressWrap{ background:#000; height:14px; border:2px solid #000; margin:6px 0 14px; }
  #rankProgressBar{ height:100%; width:0%; background:linear-gradient(90deg,#c9a227,#f6d32d); }

  #achievementList, #statsContent{ padding:10px; overflow-y:auto; font-size:8px; }
  .ach-card{
    display:flex; align-items:center; gap:8px; background:#dcdcdc;
    border-top:2px solid #fff; border-left:2px solid #fff; border-bottom:2px solid #6b6b6b; border-right:2px solid #6b6b6b;
    padding:8px; margin-bottom:8px;
  }
  .ach-card.unlocked{ background:#e8f5e9; border-color:#a5d6a7 #4caf50 #4caf50 #a5d6a7; }
  .ach-icon{ width:28px; height:28px; flex:none; border:2px solid #000; background:#1c1c1c; display:flex; align-items:center; justify-content:center; }
  .ach-icon canvas{ width:24px; height:24px; image-rendering:pixelated; }
  .ach-info{ flex:1; line-height:1.6; min-width:0; }
  .ach-info .ach-name{ font-size:8px; color:#1a1a1a; }
  .ach-info .ach-desc{ font-size:6.5px; color:#555; }
  .ach-info .ach-reward{ font-size:6.5px; color:#7a3ba0; }
  .ach-status{ font-size:6px; white-space:nowrap; padding:4px 5px; border:2px solid #000; flex-shrink:0; }
  .ach-status.done{ background:#4caf50; color:#fff; }
  .ach-status.locked{ background:#8a8a8a; color:#ccc; }
  .stats-panel{ margin-bottom:10px; padding:8px; background:#2b2b2b; color:#eee; border:2px solid #555; font-size:6.5px; line-height:1.8; }
  .stats-panel b{ color:#f6d32d; }
  #collectionGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .col-item{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#2b2b2b; border:2px solid #555; padding:4px; text-align:center; gap:3px;
  }
  .col-item .ci-icon{ width:32px; height:32px; }
  .col-item .ci-icon canvas{ width:32px; height:32px; image-rendering:pixelated; }
  .col-item .ci-name{ font-size:5.8px; color:#eee; line-height:1.3; }
  .col-item .ci-rarity{ font-size:5.2px; }
  .col-item.locked{ opacity:0.55; }

  .toast{
    position:absolute; top:110px; left:50%; transform:translateX(-50%);
    background:#000; color:#fff; padding:8px 12px; font-size:8px; border:2px solid #fff;
    z-index:30; white-space:nowrap; pointer-events:none; animation:toastAnim 2.4s ease forwards;
  }
  @keyframes toastAnim{ 0%{opacity:0; transform:translate(-50%,-10px);} 12%{opacity:1; transform:translate(-50%,0);} 80%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-10px);} }

  .rankup-flash{
    position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(0,0,0,0.6); pointer-events:none; animation:rankFade 2.2s ease forwards;
  }
  .rankup-flash .big{ font-size:14px; color:#f6d32d; text-shadow:2px 2px 0 #000; margin-bottom:10px;}
  .rankup-flash .small{ font-size:9px; color:#fff; text-shadow:2px 2px 0 #000; }
  @keyframes rankFade{ 0%{opacity:0;} 10%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }

  /* =========================================================
     RESPONSIVE LAYOUT — SIDEBAR (mobile-first)
  ========================================================= */
  #sidebar{
    position:fixed; inset:0; z-index:20; pointer-events:none;
    display:flex; flex-direction:column;
  }
  .sidebar-tabs{ display:none; }
  .sidebar-body{
    flex:1; display:flex; flex-direction:column; position:relative;
  }
  .panel-overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end; z-index:20; pointer-events:auto; }
  .panel-overlay.hidden{display:none;}
  .sheet{
    width:100%; max-height:95%; background:var(--panel);
    border-top:4px solid var(--panel-light); border-left:4px solid var(--panel-light); border-right:4px solid var(--panel-shadow);
    display:flex; flex-direction:column; color:var(--ink); overflow:hidden;
  }

  /* Tablet: canvas cresce, overlays mais largos */
  @media(min-width:768px){
    #gameContainer{ max-width:560px; }
    .sheet{ max-height:90%; }
  }

  /* Desktop ≥1024px: sidebar fixa ao lado */
  @media(min-width:1024px){
    html,body{ overflow:hidden; }
    #app{
      flex-direction:row; align-items:stretch; justify-content:flex-start;
      height:100vh; width:100vw; gap:0;
      background:
        radial-gradient(ellipse at 25% 50%, #3c332a 0%, #221c15 45%, #0d0b08 100%);
    }
    #gameContainer{
      width:auto; height:100vh; max-width:none; max-height:none;
      aspect-ratio:9/16; border:none; flex-shrink:0; background:transparent;
    }
    #gameCanvas{ width:100%; height:100%; }
    #bottomNav{ display:none; }
    #installBanner{ bottom:8px; }
    #hud{ pointer-events:none; }

    #sidebar{
      position:static; inset:auto; z-index:auto; pointer-events:auto;
      flex:1; max-width:900px;
      background:var(--panel); border-left:4px solid #000;
    }
    .sidebar-tabs{
      display:flex; gap:2px; padding:12px 12px 0; flex-shrink:0;
    }
    .st-tab{
      flex:1; font-family:'Press Start 2P',monospace; font-size:9px;
      padding:12px 6px; text-align:center; cursor:pointer;
      background:var(--panel-dark); color:#ccc;
      border:2px solid var(--panel-shadow);
      transition:background 0.15s;
    }
    .st-tab.active{ background:var(--gold); color:#3a2a00; }
    .st-tab:hover{ filter:brightness(1.15); }
    .sidebar-body{
      flex:1; display:flex; flex-direction:column; overflow:hidden;
    }
    .sidebar-body .panel-overlay{
      position:static; inset:auto; background:none; align-items:stretch;
      flex:1; display:flex;
    }
    .sidebar-body .panel-overlay.hidden{display:none;}
    .sheet{
      width:100%; max-height:none; height:100%;
      border:none; border-top:3px solid var(--panel-light);
    }
    .sheet-header{ padding:14px 16px; font-size:13px; flex-shrink:0; }
    .sheet-header .close-x{
      width:28px; height:28px; line-height:26px; font-size:12px;
    }
    .tabs{ padding:8px 12px 0; gap:4px; }
    .tab-btn{ font-size:8px; padding:10px 4px; }

    #shopList, #prestigeContent, #offlineContent, #collectionGrid{ padding:14px; font-size:9px; }
    #collectionGrid{ grid-template-columns:repeat(3,1fr); gap:10px; }

    .upgrade-card{ padding:9px; margin-bottom:8px; gap:10px; }
    .upgrade-icon{ width:34px; height:34px; }
    .upgrade-info .u-name{ font-size:9px; }
    .upgrade-info .u-desc{ font-size:7.5px; }
    .upgrade-info .u-level{ font-size:7.5px; }
    .buy-btn{ font-size:7.5px; padding:9px 6px; }
    .mc-btn{ font-size:9px; padding:12px 4px; }

    #resourceDisplay{ font-size:14px; }
    .pixel-panel{ font-size:10px; }

    #offlineOverlay.panel-overlay{
      align-items:center; z-index:30;
    }
    #offlineOverlay .sheet{
      max-height:45%; border:4px solid var(--panel-shadow);
      border-top:4px solid var(--panel-light); border-left:4px solid var(--panel-light);
    }
    #offlineContent p{ font-size:9px; }

    #rankProgressWrap{ height:14px; }
    #prestigeContent p{ font-size:9px; line-height:2; }
    .col-item .ci-name{ font-size:6.5px; }
    .col-item .ci-rarity{ font-size:6px; }

    /* scrollbar estilizada */
    #shopList::-webkit-scrollbar, #prestigeContent::-webkit-scrollbar,
    #offlineContent::-webkit-scrollbar, #collectionGrid::-webkit-scrollbar{
      width:8px;
    }
    #shopList::-webkit-scrollbar-track, #prestigeContent::-webkit-scrollbar-track,
    #offlineContent::-webkit-scrollbar-track, #collectionGrid::-webkit-scrollbar-track{
      background:var(--panel-dark);
    }
    #shopList::-webkit-scrollbar-thumb, #prestigeContent::-webkit-scrollbar-thumb,
    #offlineContent::-webkit-scrollbar-thumb, #collectionGrid::-webkit-scrollbar-thumb{
      background:var(--panel-shadow); border:1px solid var(--panel-light);
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="gameContainer">
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <div id="hud">
      <div class="pixel-panel" id="resourceRow">
        <span id="resourceDisplay">0</span>
        <span id="rankBadge"><span id="rankName">Bronze I</span></span>
      </div>
      <div class="pixel-panel" id="idleTierRow">
        <span id="idleDisplay">+0/seg</span>
        <span id="tierDisplay">Grama</span>
      </div>
    </div>

    <div id="comboBarWrap"><div id="comboBar"></div></div>
    <div id="eventBanner" class="pixel-panel"><div class="ev-name"></div><div class="ev-timer"></div></div>

    <div id="installBanner" class="pixel-panel">
      <span class="ib-text">INSTALAR O JOGO NA TELA</span>
      <button class="ib-btn" id="btnInstall">INSTALAR</button>
      <button class="ib-close" id="btnInstallClose" title="Fechar">✕</button>
    </div>

    <div id="bottomNav">
      <button class="mc-btn" id="btnShop">LOJA<span class="badge" id="badgeShop"></span></button>
      <button class="mc-btn" id="btnPrestige">PATENTE<span class="badge" id="badgePrestige"></span></button>
      <button class="mc-btn" id="btnCollection">COLEÇÃO<span class="badge" id="badgeCollection"></span></button>
      <button class="mc-btn" id="btnAchievements">CONQUISTAS<span class="badge" id="badgeAchievements"></span></button>
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-tabs">
      <div class="st-tab active" data-sidebar="shopOverlay">LOJA<span class="badge" id="badgeShopSt"></span></div>
      <div class="st-tab" data-sidebar="prestigeOverlay">PATENTE<span class="badge" id="badgePrestigeSt"></span></div>
      <div class="st-tab" data-sidebar="collectionOverlay">COLEÇÃO<span class="badge" id="badgeCollectionSt"></span></div>
      <div class="st-tab" data-sidebar="achievementOverlay">CONQUISTAS<span class="badge" id="badgeAchievementsSt"></span></div>
    </div>
    <div class="sidebar-body">
      <div class="panel-overlay hidden" id="shopOverlay">
        <div class="sheet">
          <div class="sheet-header"><span>LOJA DE UPGRADES</span><span class="close-x" data-close="shopOverlay">✕</span></div>
          <div class="tabs">
            <div class="tab-btn active" data-tab="pickaxe">PICARETAS</div>
            <div class="tab-btn" data-tab="enchant">ENCANTOS</div>
            <div class="tab-btn" data-tab="miner">MINERADORES</div>
          </div>
          <div id="shopList"></div>
        </div>
      </div>

      <div class="panel-overlay hidden" id="prestigeOverlay">
        <div class="sheet">
          <div class="sheet-header"><span>PATENTE DE MINERADOR</span><span class="close-x" data-close="prestigeOverlay">✕</span></div>
          <div id="prestigeContent"></div>
        </div>
      </div>

      <div class="panel-overlay hidden" id="achievementOverlay">
        <div class="sheet">
          <div class="sheet-header"><span>CONQUISTAS</span><span class="close-x" data-close="achievementOverlay">✕</span></div>
          <div style="padding:10px; display:flex; gap:4px;">
            <div class="tab-btn active" data-achtab="list">LISTA</div>
            <div class="tab-btn" data-achtab="stats">ESTATÍSTICAS</div>
          </div>
          <div id="achievementList"></div>
          <div id="statsContent" style="display:none;"></div>
        </div>
      </div>

      <div class="panel-overlay hidden" id="collectionOverlay">
        <div class="sheet">
          <div class="sheet-header"><span id="collectionHeader">MURAL DE RARIDADES</span><span class="close-x" data-close="collectionOverlay">✕</span></div>
          <div id="collectionGrid"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="panel-overlay hidden" id="offlineOverlay">
  <div class="sheet" style="max-width:500px; margin:0 auto;">
    <div class="sheet-header"><span>BEM-VINDO DE VOLTA</span><span class="close-x" data-close="offlineOverlay">✕</span></div>
    <div id="offlineContent"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   ÍCONES PIXEL ART (substituem emojis em toda a interface)
========================================================= */
function newIconCanvas(){
  var c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  return c;
}
function makeIcon(kind, color){
  var c = newIconCanvas();
  var g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  color = color || '#cccccc';

  switch(kind){
    case 'pickaxe':
      g.fillStyle = '#6b4423';
      g.fillRect(6,6,2,9); g.fillRect(8,4,2,9);
      g.fillStyle = color;
      g.fillRect(1,1,6,3); g.fillRect(9,1,6,3); g.fillRect(6,0,4,3);
      g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1;
      g.strokeRect(1,1,6,3); g.strokeRect(9,1,6,3);
      break;
    case 'fortune':
      g.fillStyle = color;
      g.fillRect(3,10,10,3); g.fillRect(4,7,8,3); g.fillRect(5,4,6,3);
      g.strokeStyle = 'rgba(0,0,0,0.35)';
      g.strokeRect(3,10,10,3); g.strokeRect(4,7,8,3); g.strokeRect(5,4,6,3);
      break;
    case 'luck':
      g.fillStyle = color;
      g.fillRect(6,2,4,3); g.fillRect(2,5,4,4); g.fillRect(10,5,4,4);
      g.fillRect(6,7,4,3); g.fillRect(7,10,2,5);
      break;
    case 'precision':
      g.strokeStyle = color; g.lineWidth = 2;

      g.fillRect(3,3,2,2); g.fillRect(11,3,2,2); g.fillRect(3,11,2,2); g.fillRect(11,11,2,2);

      g.fillStyle = '#ff3b6b'; g.fillRect(7,1,2,14);
      g.fillStyle = '#4bb4ff'; g.fillRect(1,7,14,2);
      g.fillStyle = '#ffd700'; g.fillRect(5,5,6,6);
      g.fillStyle = '#0d0b08'; g.fillRect(6,6,4,4);
      break;
    case 'star':
      g.fillStyle = color;
      g.fillRect(7,2,2,4); g.fillRect(5,5,6,2); g.fillRect(5,9,6,2); g.fillRect(7,10,2,4);
      g.fillRect(2,7,4,2); g.fillRect(10,7,4,2);
      break;
    case 'skull':
      g.fillStyle = '#e0e0e0';
      g.fillRect(3,4,10,3); g.fillRect(5,7,6,3); g.fillRect(5,10,6,2); g.fillRect(4,11,8,2);
      g.fillStyle = '#111'; g.fillRect(5,5,2,2); g.fillRect(9,5,2,2);
      g.fillRect(6,8,4,1); g.fillRect(7,9,2,2);
      break;
    default:
      g.fillStyle = color; g.fillRect(3,3,10,10);
  }
  return c;
}

var RANK_SUB = ['I','II','III','IV','V'];
var RANK_STEPS_TOTAL = RANK_NAMES.length * RANK_SUB.length;

var RANK_THRESHOLDS = (function(){
  var arr = [0];
  for(var i=1;i<RANK_STEPS_TOTAL;i++){ arr.push(arr[i-1] + Math.round(2 + i*i*0.55)); }
  return arr;
})();

function getRankStep(diamonds){
  var step = 0;
  for(var i=0;i<RANK_THRESHOLDS.length;i++){ if(diamonds >= RANK_THRESHOLDS[i]) step = i; else break; }
  return step;
}
function getRankInfo(step){
  step = Math.min(step, RANK_STEPS_TOTAL-1);
  var tierIdx = Math.floor(step/5); var subIdx = step%5;
  return { tierIdx:tierIdx, subIdx:subIdx, name: RANK_NAMES[tierIdx]+' '+RANK_SUB[subIdx], color: RANK_COLORS[tierIdx], step: step };
}

function save(){
  state.lastSave = Date.now();

function load(){
  var raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw){ state = defaultState(); return; }
  try{
    var loaded = JSON.parse(raw);
    state = defaultState();
    for(var k in loaded){
      if(k==='upgrades' || k==='collection'){ for(var kk in loaded[k]){ state[k][kk] = loaded[k][kk]; } }
      else { state[k] = loaded[k]; }
    }
    recomputeStats();
    var elapsedSec = Math.min((Date.now() - state.lastSave)/1000, 8*3600);
    if(elapsedSec > 5 && state.idlePerSec > 0){
      var gained = Math.floor(state.idlePerSec * rankMult() * state.fortuneMult * elapsedSec);
      if(gained > 0){
        state.resources += gained; state.totalEarned += gained;
        showOfflinePopup(gained, elapsedSec);
      }
    }
  }catch(e){ state = defaultState(); }
}

/* =========================================================
   PRNG determinístico + helpers de cor
========================================================= */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hexToRgb(hex){
  hex = hex.replace('#','');
  return {r:parseInt(hex.substring(0,2),16), g:parseInt(hex.substring(2,4),16), b:parseInt(hex.substring(4,6),16)};
}
function shade(hex, amt){
  var c = hexToRgb(hex);
  return 'rgb('+Math.max(0,Math.min(255,c.r+amt))+','+Math.max(0,Math.min(255,c.g+amt))+','+Math.max(0,Math.min(255,c.b+amt))+')';
}

var TEX_SIZE = 16;
var textureCache = {};
function buildTexture(tier){
  var c = document.createElement('canvas'); c.width = TEX_SIZE; c.height = TEX_SIZE;
  var ctx = c.getContext('2d');
  var rng = mulberry32(tier.id.length*7919 + tier.baseHp);

  if(tier.special === 'grass'){
    ctx.fillStyle = tier.dirt; ctx.fillRect(0,0,TEX_SIZE,TEX_SIZE);
    for(var y=0;y<TEX_SIZE;y++){
      for(var x=0;x<TEX_SIZE;x++){
        var n = rng(); var col = tier.dirt;
        if(y < 4){ col = n<0.5? tier.base : tier.light; }
        else if(y===4){ col = n<0.6 ? tier.dark : tier.dirt; }
        else { col = n<0.15 ? shade(tier.dirt,-20) : tier.dirt; }
        ctx.fillStyle = col; ctx.fillRect(x,y,1,1);
      }
    }
  } else {
    for(var y2=0;y2<TEX_SIZE;y2++){
      for(var x2=0;x2<TEX_SIZE;x2++){
        var n2 = rng(); var col2 = tier.base;
        if(n2 < 0.18) col2 = tier.dark; else if(n2 > 0.9) col2 = tier.light;
        ctx.fillStyle = col2; ctx.fillRect(x2,y2,1,1);
      }
    }
    if(tier.speckle){
      var clusters = 4 + Math.floor(rng()*4);
      for(var i=0;i<clusters;i++){
        var cx = 1 + Math.floor(rng()*(TEX_SIZE-2));
        var cy = 1 + Math.floor(rng()*(TEX_SIZE-2));
        var shape = [[0,0],[1,0],[0,1],[1,1]];
        for(var s=0;s<shape.length;s++){
          if(rng()<0.75){ ctx.fillStyle = tier.speckle; ctx.fillRect(cx+shape[s][0], cy+shape[s][1], 1, 1); }
        }
      }
    }
  }
  return c;
}
function getTexture(tier){
  if(!textureCache[tier.id]) textureCache[tier.id] = buildTexture(tier);
  return textureCache[tier.id];
}
var crackCache = [];
function buildCrackStage(stage){
  var c = document.createElement('canvas'); c.width=TEX_SIZE; c.height=TEX_SIZE;
  var ctx = c.getContext('2d'); var rng = mulberry32(9000+stage);
  var count = 10 + stage*14;
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  for(var i=0;i<count;i++){ ctx.fillRect(Math.floor(rng()*TEX_SIZE), Math.floor(rng()*TEX_SIZE), 1, 1); }
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  for(var j=0;j<stage*2;j++){ ctx.fillRect(Math.floor(rng()*(TEX_SIZE-1)), Math.floor(rng()*(TEX_SIZE-1)), 2, 2); }
  return c;
}
for(var s=0; s<4; s++){ crackCache.push(buildCrackStage(s)); }

var audioCtx = null;
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, delay){
  if(!audioCtx) return;
  type = type||'square'; vol = vol==null?0.15:vol; delay = delay||0;
  var t0 = audioCtx.currentTime + delay;
  var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur);
}
function playClickSound(isCrit){ beep(isCrit?880:520, 0.08, 'square', 0.10); }
function playBreakSound(){ beep(180,0.2,'sawtooth',0.18); beep(100,0.3,'square',0.14,0.05); beep(60,0.45,'sawtooth',0.10,0.12); }

  n = Math.floor(n);
  if(n < 1000) return String(n);
  var units = ['K','M','B','T','Qa','Qi','Sx','Sp']; var u=-1; var v=n;
  while(v >= 1000 && u < units.length-1){ v/=1000; u++; }
  var dec = v<10?2:(v<100?1:0);
  return v.toFixed(dec)+units[u];
}

function handleTap(x,y){
  if(!pointInBlock(x,y)) return;
  ensureAudio();
  var now = performance.now();
  var comboWindow = 600 + state.tierIndex * 4; // 600ms at tier 0, up to ~716ms at tier 29
  if(now - state.lastClickTime < comboWindow){ state.comboCount = Math.min(20, state.comboCount+1); }
  else { state.comboCount = 0; }
  state.lastClickTime = now;

  var comboMult = 1 + (state.comboCount/20)*0.5;
  comboMult += (state.upgrades.berserker*0.03) * (state.comboCount/20);

  var isCrit = Math.random() < state.critChance;
  var dmg = state.clickPower * comboMult * (isCrit ? state.critMult : 1);
  dmg = Math.max(1, Math.round(dmg * eventClickMult));
  if(eventHalfHp) dmg *= 2;
  state.blockHp -= dmg;

  state.stats.totalClicks++;
  if(isCrit) state.stats.totalCrits++;
  if(state.comboCount>state.stats.bestCombo) state.stats.bestCombo=state.comboCount;

  var tier = currentTier();
  var hitColor = tier.speckle||tier.light;
  spawnParticles(x, y, hitColor, isCrit?12:6);
  spawnShockwave(x, y, isCrit?55:35, isCrit?'#ff5555':'#ffffff', isCrit?0.5:0.35);
  spawnFloatingText(x, y-10, (isCrit?'CRÍTICO! ':'')+'+'+format(dmg), isCrit?'#ff5555':'#ffffff', isCrit);
  playClickSound(isCrit); vibrate(isCrit?[15,10,15]:10);
  shakeMag = Math.max(shakeMag, isCrit?5:1.5); punch = 1;

  if(state.comboCount===5||state.comboCount===10||state.comboCount===15||state.comboCount===20){
    comboFlashTimer=0.35; spawnShockwave(BLOCK_CX,BLOCK_CY,90,'#ffd700',0.7);
    screenFlash={color:'#ffd700',alpha:0.15};
  }

  if(Math.random() < state.upgrades.fragment*0.04){
    state.blockHp -= dmg;
    spawnFloatingText(x, y-26, 'GOLPE DUPLO!', '#00e5ff', false);
  }
  if(Math.random() < state.upgrades.midnight*0.005){
    state.blockHp = 0;
    spawnFloatingText(BLOCK_CX, BLOCK_CY-20, 'TOQUE DA MEIA-NOITE!', '#673ab7', true);
  }
  if(state.blockHp <= 0){ breakBlock(); }
}

/* =========================================================
   LOOP PRINCIPAL
========================================================= */
var lastTime = performance.now();
var hudTimer = 0;

function update(dt){
  if(state.idlePerSec > 0){
    var gain = state.idlePerSec * rankMult() * state.fortuneMult * dt;
    state.resources += gain; state.totalEarned += gain;
  }
  var comboDecayThresh = 600 + state.tierIndex * 4;
  if(performance.now() - state.lastClickTime > comboDecayThresh && state.comboCount > 0){
    state.comboCount = Math.max(0, state.comboCount - dt*8);
  }
  shakeMag *= Math.pow(0.001, dt);
  if(state.tierIndex>20) shakeMag = Math.max(shakeMag, 0.15 + (state.tierIndex-20)*0.02);
  if(shakeMag < 0.05) shakeMag = 0;
  punch *= Math.pow(0.0005, dt); if(punch < 0.02) punch = 0;

  for(var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.vy += 260*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.life <= 0) particles.splice(i,1);
  }
  for(var j=floatingTexts.length-1;j>=0;j--){
    var f = floatingTexts[j];
    f.y += f.vy*dt; f.alpha -= dt*1.1;
    if(f.alpha <= 0) floatingTexts.splice(j,1);
  }

  for(var swi=shockwaves.length-1;swi>=0;swi--){
    var sw=shockwaves[swi];
    sw.radius+=(sw.maxRadius-sw.radius)*dt*4;
    sw.alpha-=dt*1.8;
    if(sw.alpha<=0) shockwaves.splice(swi,1);
  }
  if(screenFlash.alpha>0){ screenFlash.alpha-=dt*1.2; if(screenFlash.alpha<0) screenFlash.alpha=0; }

  for(var pi=minerProjectiles.length-1;pi>=0;pi--){
    var pr=minerProjectiles[pi];
    pr.progress+=dt/pr.duration;
    if(pr.progress>=1){
      spawnParticles(BLOCK_CX,BLOCK_CY,pr.color,4);
      minerProjectiles.splice(pi,1);
    } else {
      pr.x=pr.startX+(BLOCK_CX-pr.startX)*pr.progress;
      pr.y=pr.startY+(BLOCK_CY-pr.startY)*pr.progress;
    }
  }
  var activeMiners=0;
  for(var mi=0;mi<8;mi++){ if(state.upgrades[MINER_ORDER[mi]]>0) activeMiners++; }
  if(activeMiners>0){
    minerFireTimer+=dt*(1+activeMiners*0.08);
    if(minerFireTimer>=0.7){
      minerFireTimer=0;
      var activeIndices=[];
      for(var mi2=0;mi2<8;mi2++){ if(state.upgrades[MINER_ORDER[mi2]]>0) activeIndices.push(mi2); }
      var chosen=activeIndices[Math.floor(Math.random()*activeIndices.length)];
      var side=chosen%2===0?30:W-30;
      var baseY=470+Math.floor(chosen/2)*46;
      minerProjectiles.push({x:side,y:baseY,startX:side,startY:baseY,progress:0,duration:0.2+Math.random()*0.15,color:MINER_COLORS[MINER_ORDER[chosen]]});
      minerSwingTimers[chosen]=0.12;
    }
  }
  for(var ms=0;ms<minerSwingTimers.length;ms++){ if(minerSwingTimers[ms]>0) minerSwingTimers[ms]-=dt; }

  var dmgPct=state.blockHp>0?1-state.blockHp/state.blockMaxHp:0;
  if(dmgPct>0.5&&state.blockHp>0){
    fragmentTimer+=dt;
    if(fragmentTimer>0.07){ fragmentTimer=0; var ft=currentTier(); spawnParticles(BLOCK_CX+(Math.random()-0.5)*80,BLOCK_CY+(Math.random()-0.5)*80,ft.dark||ft.base,1); }
  }

  if(state.idlePerSec>0){
    incomeFloaterTimer+=dt*(1+state.idlePerSec*0.0005);
    if(incomeFloaterTimer>1.2){
      incomeFloaterTimer=0;
      var ig=Math.floor(state.idlePerSec*rankMult()*state.fortuneMult*0.06);
      if(ig>0) spawnFloatingText(W/2-60+Math.random()*120,490+Math.random()*40,'+'+format(ig),'#ffe066',false);
    }
  }

  if(comboFlashTimer>0) comboFlashTimer-=dt;
  if(tierTransitionTimer>0){
    tierTransitionTimer-=dt;
    if(tierTransitionTimer<=0&&tierTransitionTimer>-5){
      tierTransitionTimer=-999;
      var nt=currentTier();
      spawnParticles(BLOCK_CX,BLOCK_CY,nt.speckle||nt.light,35);
      spawnShockwave(BLOCK_CX,BLOCK_CY,130,nt.speckle||nt.light,0.7);
      screenFlash={color:nt.speckle||nt.light,alpha:0.3};
    }
  }

  if(!activeEvent){
    eventTimer+=dt;
    var ti=state.tierIndex;
    var minGap=ti<6?45:(ti<16?22:10);
    var maxGap=ti<6?80:(ti<16?40:20);
    var chance=ti<6?0.35:(ti<16?0.55:0.75);
    if(eventTimer>minGap+Math.random()*(maxGap-minGap)){
      eventTimer=0;
      if(Math.random()<chance) startRandomEvent();
    }
  } else {
    activeEvent.timer-=dt;
    if(eventFrenzy>0){
      frenzyAccum+=dt;
      if(frenzyAccum>0.1){
        frenzyAccum=0;
        var dmg=state.clickPower*(1+(state.comboCount/20)*0.5)*(1+state.upgrades.berserker*0.03*(state.comboCount/20));
        state.blockHp-=Math.max(1,Math.round(dmg));
        spawnParticles(BLOCK_CX+(Math.random()-0.5)*40,BLOCK_CY+(Math.random()-0.5)*40,'#00e5ff',1);
        if(state.blockHp<=0) breakBlock();
      }
    }
    eventBannerTimer.textContent=Math.ceil(activeEvent.timer)+'s';
    if(activeEvent.timer<=0) endEvent();
  }

  state.stats.playTime = (state.stats.playTime||0) + dt;

  hudTimer += dt;
  if(hudTimer > 0.1){ hudTimer = 0; updateHUD(); }
}

function drawBackground(now){
  var ti=state.tierIndex;
  var heat=Math.min(1,ti/20);
  var r1=Math.round(43+heat*60), g1=Math.round(36-heat*10), b1=Math.round(28-heat*15);
  var r2=Math.round(16+heat*40), g2=Math.round(13-heat*5), b2=Math.round(9-heat*5);
  var grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgb('+r1+','+g1+','+b1+')');
  grad.addColorStop(1,'rgb('+r2+','+g2+','+b2+')');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  var gridCount=18+Math.floor(heat*12);
  ctx.globalAlpha = 0.25+heat*0.15;
  for(var i=0;i<gridCount;i++){
    var bx = (i*53+ti*7) % W; var by = 40 + ((i*97+ti*11) % (H-120));
    ctx.fillStyle = (i%2===0)? '#3c332a' : '#221c15';
    ctx.fillRect(bx, by, 30+Math.floor(heat*8), 30+Math.floor(heat*8));
  }
  ctx.globalAlpha = 1;
  var glowSize=140+Math.floor(heat*80);
  var glowA=0.25+heat*0.2;
  var glow1 = ctx.createRadialGradient(50,150,5,50,150,glowSize);
  glow1.addColorStop(0,'rgba(255,200,80,'+glowA+')'); glow1.addColorStop(1,'rgba(255,200,80,0)');
  ctx.fillStyle = glow1; ctx.fillRect(0,0,W,H);
  var glow2 = ctx.createRadialGradient(W-50,450,5,W-50,450,glowSize);
  glow2.addColorStop(0,'rgba(255,150,50,'+(glowA*0.2+heat*0.3)+')'); glow2.addColorStop(1,'rgba(255,150,50,0)');
  ctx.fillStyle = glow2; ctx.fillRect(0,0,W,H);
  if(heat>0.5){
    var sp=heat*0.08;
    ctx.globalAlpha=sp*0.5;
    for(i=0;i<Math.floor(heat*8);i++){
      ctx.fillStyle='#ff8844'; ctx.fillRect(Math.floor(Math.random()*W),Math.floor(Math.random()*H),2,2);
    }
    ctx.globalAlpha=1;
  }
}

function drawMiners(now){
  var slot = 0;
  for(var k=0;k<MINER_ORDER.length;k++){
    var lvl = state.upgrades[MINER_ORDER[k]];
    if(lvl <= 0) continue;
    if(slot >= 6) break;
    var side = slot%2===0 ? 30 : W-30;
    var baseY = 470 + Math.floor(slot/2)*46;
    var swing = minerSwingTimers[k]>0 ? Math.sin(minerSwingTimers[k]/0.12*Math.PI)*7 : 0;
    var bob = Math.sin(now/300 + slot)*4 + swing;
    ctx.fillStyle = MINER_COLORS[MINER_ORDER[k]];
    ctx.fillRect(side-9, baseY+bob-9, 18, 18);
    ctx.fillStyle = '#0d0b08';
    ctx.fillRect(side-6, baseY+bob-5, 2, 2); ctx.fillRect(side+2, baseY+bob-5, 2, 2);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeRect(side-9, baseY+bob-9, 18, 18);
    if(swing>0){
      ctx.fillStyle = MINER_COLORS[MINER_ORDER[k]];
      ctx.fillRect(side+(swing>0?6:-12), baseY+bob-12, 4, 6);
    }
    ctx.fillStyle = '#fff'; ctx.font = "6px 'Press Start 2P'"; ctx.textAlign = 'center';
    ctx.fillText('x'+lvl, side, baseY+bob+18);
    slot++;
  }
}

function drawBlock(now){
  var tier = currentTier();
  var tex = getTexture(tier);
  var bounce = Math.sin(now/500)*3;
  var scale = 1 + punch*0.12;
  var size = 148*scale;
  var x = BLOCK_CX - size/2;
  var y = BLOCK_CY + bounce - size/2;

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tex, 0,0, TEX_SIZE, TEX_SIZE, x, y, size, size);

  if(tier.special === 'eternal'){
    var hue = (now/20) % 360;
    ctx.globalAlpha = 0.25; ctx.fillStyle = 'hsl('+hue+',80%,60%)'; ctx.fillRect(x,y,size,size); ctx.globalAlpha = 1;
  } else if(tier.special === 'glow'){
    var pulse = 0.15 + Math.sin(now/300)*0.08;
    ctx.globalAlpha = pulse; ctx.fillStyle = tier.speckle; ctx.fillRect(x,y,size,size); ctx.globalAlpha = 1;
  }

  var dmgPct = state.blockHp>0 ? 1-(state.blockHp/state.blockMaxHp) : 0;
  var stage = Math.min(3, Math.floor(dmgPct*4));
  if(dmgPct > 0.05){ ctx.drawImage(crackCache[stage], 0,0,TEX_SIZE,TEX_SIZE, x, y, size, size); }

  if(dmgPct>0.75 && state.blockHp>0){
    var sp=0.08+Math.sin(now/150)*0.06;
    ctx.globalAlpha=sp; ctx.fillStyle='#ff3333'; ctx.fillRect(x-3,y-3,size+6,size+6); ctx.globalAlpha=1;
  }
  if(state.comboCount>5){
    var cg=(state.comboCount/20)*0.15;
    var ch=(now/50)%360;
    ctx.globalAlpha=cg; ctx.fillStyle='hsl('+ch+',100%,60%)'; ctx.fillRect(x-4,y-4,size+8,size+8); ctx.globalAlpha=1;
  }
  if(comboFlashTimer>0){
    var cf=comboFlashTimer/0.35;
    ctx.globalAlpha=cf*0.4; ctx.fillStyle='#ffd700'; ctx.fillRect(x-6,y-6,size+12,size+12); ctx.globalAlpha=1;
  }

  if(activeEvent){
    var evColor='#fff';
    for(var ei=0;ei<EVENTS.length;ei++){ if(EVENTS[ei].id===activeEvent.id){ evColor=EVENTS[ei].color; break; } }
    var ea=0.12+Math.sin(now/120)*0.08;
    ctx.globalAlpha=ea; ctx.fillStyle=evColor; ctx.fillRect(x-5,y-5,size+10,size+10); ctx.globalAlpha=1;
  }

  var isBoss = state.tierIndex>0 && state.tierIndex%5===4;
  if(isBoss){
    var bp=0.15+Math.sin(now/200)*0.1;
    ctx.globalAlpha=bp; ctx.strokeStyle='#ff5555'; ctx.lineWidth=5; ctx.strokeRect(x-4,y-4,size+8,size+8); ctx.globalAlpha=1;
    ctx.fillStyle='#ff5555'; ctx.font="8px 'Press Start 2P'"; ctx.textAlign='center';
    ctx.fillText('BOSS',BLOCK_CX,y-16);
    var sk = makeIcon('skull'); ctx.drawImage(sk,BLOCK_CX-8,y-32,16,16);
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3; ctx.strokeRect(x,y,size,size);
  ctx.restore();

  var barW = 160, barH = 10;
  var barX = BLOCK_CX-barW/2, barY = BLOCK_CY+size/2+bounce+16;
  ctx.fillStyle = '#000'; ctx.fillRect(barX-2, barY-2, barW+4, barH+4);
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = '#5ec14a'; ctx.fillRect(barX, barY, barW*Math.max(0,state.blockHp/state.blockMaxHp), barH);
}

function drawShockwaves(){
  for(var i=0;i<shockwaves.length;i++){
    var s=shockwaves[i];
    ctx.globalAlpha=Math.max(0,s.alpha);
    ctx.strokeStyle=s.color; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.radius,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawProjectiles(){
  for(var i=0;i<minerProjectiles.length;i++){
    var p=minerProjectiles[i];
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
    ctx.fillStyle='#fff';
    ctx.fillRect(p.x-1,p.y-1,2,2);
  }
}
function drawScreenFlash(){
  if(screenFlash.alpha>0.01){
    ctx.globalAlpha=screenFlash.alpha;
    ctx.fillStyle=screenFlash.color||'#fff';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
}
function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function drawFloatingTexts(){
  ctx.textAlign = 'center';
  for(var i=0;i<floatingTexts.length;i++){
    var f = floatingTexts[i];
    ctx.globalAlpha = Math.max(0,f.alpha);
    ctx.font = (f.big? "11px" : "8px")+" 'Press Start 2P'";
    ctx.fillStyle = '#000'; ctx.fillText(f.text, f.x+1, f.y+1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  var sx = shakeMag>0 ? (Math.random()-0.5)*shakeMag : 0;
  var sy = shakeMag>0 ? (Math.random()-0.5)*shakeMag : 0;
  ctx.save(); ctx.translate(sx, sy);
  drawBackground(now); drawMiners(now); drawBlock(now); drawProjectiles(); drawParticles(); drawShockwaves(); drawFloatingTexts();
  ctx.restore();
  drawScreenFlash();
}
function loop(now){
  var dt = Math.min(0.05, (now-lastTime)/1000);
  lastTime = now;
  update(dt); draw(now);
  requestAnimationFrame(loop);
}

function countBuyableUpgrades(){
  var c=0;
  if(state.pickaxeIndex+1<PICKAXES.length&&state.resources>=PICKAXES[state.pickaxeIndex+1].cost) c++;
  for(var i=0;i<UPGRADES.length;i++){
    if(state.resources>=upgradeCost(UPGRADES[i])) c++;
  }
  return c;
}
function countPrestigeGain(){ return calcDiamondGain(state.totalEarned); }

function updateHUD(){
  resourceDisplay.textContent = format(state.resources);
  var idleTotal = state.idlePerSec * rankMult() * state.fortuneMult;
  idleDisplay.textContent = '+'+format(idleTotal)+'/seg';
  var tier = currentTier();
  var goalTxt = isFinite(tier.goal) ? (state.blocksBrokenInTier+'/'+tier.goal) : '∞';

    spawnFloatingText(BLOCK_CX,BLOCK_CY-100,'CONQUISTA! '+pa.name,catColor,true);
    ensureAudio();
    beep(880,0.12,'triangle',0.18,0);
    beep(1100,0.12,'triangle',0.14,0.08);

    spawnParticles(BLOCK_CX,BLOCK_CY,catColor,20);

  var bShop=countBuyableUpgrades();

  var bColl=state.newCollectionItems||0;
  var bAch=state.newAchievements||0;
  [

    ['badgeAchievements','badgeAchievementsSt']

  });
}

function renderShop(){

    PICKAXES.forEach(function(pk, idx){

        btn.addEventListener('click', function(){ buyPickaxe(idx); });
      } else {
        btn.textContent = 'BLOQUEADA'; btn.disabled = true; btn.classList.add('locked');
      }
      card.appendChild(btn);
      shopList.appendChild(card);
    });
    return;
  }

  var list = UPGRADES.filter(function(u){ return u.category===activeTab; });
  list.forEach(function(u){
    var cost = upgradeCost(u);
    var card = document.createElement('div'); card.className = 'upgrade-card';
    var icon = document.createElement('div'); icon.className = 'upgrade-icon';
    icon.appendChild(iconEl(u.iconKind, u.color, 28));
    card.appendChild(icon);

    var info = document.createElement('div'); info.className = 'upgrade-info';
    info.innerHTML = '<div class="u-name" style="color:'+u.color+'">'+u.name+'</div>'+
                      '<div class="u-desc">'+u.desc+'</div>'+
                      '<div class="u-level">Nível '+state.upgrades[u.id]+'</div>';
    card.appendChild(info);

    var btn = document.createElement('button'); btn.className = 'buy-btn';
    btn.textContent = format(cost);
    btn.disabled = state.resources < cost;
    btn.addEventListener('click', function(){ buyUpgrade(u.id); });
    card.appendChild(btn);
    shopList.appendChild(card);
  });
}

function buyPickaxe(idx){
  var pk = PICKAXES[idx];
  if(idx !== state.pickaxeIndex+1) return;
  if(state.resources < pk.cost) return;
  state.resources -= pk.cost;
  state.pickaxeIndex = idx;
  if(idx===PICKAXES.length-1) state.stats.boughtAllPickaxes=true;
  recomputeStats();
  ensureAudio(); playBuySound();
  showToast('Picareta equipada: '+pk.name, pk.color);
  save(); renderShop(); updateHUD();
}
function buyUpgrade(id){
  var u = null;
  for(var i=0;i<UPGRADES.length;i++){ if(UPGRADES[i].id===id){ u=UPGRADES[i]; break; } }
  if(!u) return;
  var cost = upgradeCost(u);
  if(state.resources < cost) return;
  state.resources -= cost;
  state.upgrades[id]++;
  recomputeStats();
  ensureAudio(); playBuySound();
  save(); renderShop(); updateHUD();
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    activeTab = btn.getAttribute('data-tab');
    renderShop();
  });
});
document.querySelectorAll('[data-achtab]').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('[data-achtab]').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    if(btn.getAttribute('data-achtab')==='list') renderAchievements();
    else renderStats();
  });
});

/* =========================================================
   PATENTE (prestígio)
========================================================= */
var prestigeContent = document.getElementById('prestigeContent');
function renderPrestige(){
  var gain = calcDiamondGain(state.totalEarned);
  var step = getRankStep(state.diamonds);
  var info = getRankInfo(step);
  var nextThreshold = RANK_THRESHOLDS[Math.min(step+1, RANK_THRESHOLDS.length-1)];
  var prevThreshold = RANK_THRESHOLDS[step];
  var progress = step >= RANK_STEPS_TOTAL-1 ? 1 : (state.diamonds-prevThreshold)/(nextThreshold-prevThreshold);

  var html = '';
  html += '<p>Reconstruir o mundo reseta seus recursos, picareta e upgrades — mas concede Diamantes permanentes que sobem sua patente para sempre.</p>';
  html += '<p>Patente atual: <b style="color:'+info.color+'">'+info.name+'</b> &nbsp; (bônus +'+Math.round((rankMult()-1)*100)+'%)</p>';
  html += '<div id="rankProgressWrap"><div id="rankProgressBar" style="width:'+Math.round(progress*100)+'%"></div></div>';
  html += '<p>Diamantes: <b>'+state.diamonds+'</b></p>';
  html += '<p>Total minerado nesta jornada: <b>'+format(state.totalEarned)+'</b></p>';
  html += '<p>Diamantes a ganhar agora: <b style="color:#7a3ba0">'+gain+'</b></p>';
  prestigeContent.innerHTML = html;

  var btn = document.createElement('button');
  btn.className = 'mc-btn'; btn.id = 'prestigeConfirm';
  btn.textContent = gain > 0 ? 'RECONSTRUIR O MUNDO (+'+gain+' DIAMANTES)' : 'MINERE MAIS PARA DESBLOQUEAR';
  btn.disabled = gain <= 0; if(gain<=0){ btn.style.opacity=0.6; }
  btn.addEventListener('click', doPrestige);
  prestigeContent.appendChild(btn);
}
function doPrestige(){
  var gain = calcDiamondGain(state.totalEarned);
  if(gain <= 0) return;
  state.diamonds += gain;
  state.stats.prestigeCount++;
  state.resources = 0; state.totalEarned = 0; state.pickaxeIndex = 0;
  state.upgrades = {
    fortune:0, luck:0, precision:0, berserker:0, midnight:0, greed:0, fragment:0, minerLuck:0,
    minerAldeao:0, minerFerreiro:0, minerGolem:0, minerGolemD:0, minerEsqueleto:0, minerPiglin:0, minerDragao:0, minerTita:0
  };
  state.tierIndex = 0; state.blocksBrokenInTier = 0;
  recomputeStats();
  state.blockMaxHp = TIERS[0].baseHp; state.blockHp = TIERS[0].baseHp;
  ensureAudio(); playPrestigeSound();
  save(); renderShop(); renderPrestige(); updateHUD();
  closePanel('prestigeOverlay');
}

/* =========================================================
   COLEÇÃO
========================================================= */
var collectionGrid = document.getElementById('collectionGrid');
var collectionHeader = document.getElementById('collectionHeader');
function renderCollection(){
  state.newCollectionItems = 0;
  var found = 0;
  for(var k in state.collection){ if(state.collection[k]) found++; }
  collectionHeader.textContent = 'MURAL DE RARIDADES ('+found+'/'+COLLECTIBLES.length+')';
  collectionGrid.innerHTML = '';
  COLLECTIBLES.forEach(function(item){
    var r = rarityInfo(item.rarity);
    var has = !!state.collection[item.id];
    var div = document.createElement('div');
    div.className = 'col-item'+(has?'':' locked');
    div.style.borderColor = r.color;
    var iconWrap = document.createElement('div'); iconWrap.className = 'ci-icon';
    iconWrap.appendChild(iconEl(has ? ('col_'+item.rarity) : 'locked', has ? r.color : '#555', 32));
    div.appendChild(iconWrap);
    var nameEl = document.createElement('div'); nameEl.className = 'ci-name'; nameEl.textContent = has ? item.name : '???';
    div.appendChild(nameEl);
    var rEl = document.createElement('div'); rEl.className = 'ci-rarity'; rEl.style.color = r.color; rEl.textContent = r.name;
    div.appendChild(rEl);
    collectionGrid.appendChild(div);
  });
}

/* =========================================================
   POPUP OFFLINE
========================================================= */
var offlineContent = document.getElementById('offlineContent');
function showOfflinePopup(gained, elapsedSec){
  var hours = (elapsedSec/3600);
  var hTxt = hours < 1 ? Math.floor(elapsedSec/60)+' minutos' : hours.toFixed(1)+' horas';
  offlineContent.innerHTML = '<p>Enquanto você estava fora, seus mineradores trabalharam por <b>'+hTxt+'</b> e produziram:</p>'+
    '<p style="font-size:14px; color:#1a5c1a; text-align:center;">+'+format(gained)+'</p>';
  openPanel('offlineOverlay');
}

/* =========================================================
   CONTROLE DE PAINÉIS
========================================================= */
function openPanel(id){
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.st-tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-sidebar')===id);
  });
}
function closePanel(id){
  document.getElementById(id).classList.add('hidden');
  document.querySelectorAll('.st-tab').forEach(function(t){
    if(t.getAttribute('data-sidebar')===id) t.classList.remove('active');
  });
}
document.getElementById('btnShop').addEventListener('click', function(){ renderShop(); openPanel('shopOverlay'); });
document.getElementById('btnPrestige').addEventListener('click', function(){ renderPrestige(); openPanel('prestigeOverlay'); });
document.getElementById('btnCollection').addEventListener('click', function(){ renderCollection(); openPanel('collectionOverlay'); });
document.getElementById('btnAchievements').addEventListener('click', function(){ renderAchievements(); openPanel('achievementOverlay'); });
document.querySelectorAll('[data-close]').forEach(function(el){
  el.addEventListener('click', function(){ closePanel(el.getAttribute('data-close')); });
});

/* Sidebar tabs (desktop) */
document.querySelectorAll('.st-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    var target = tab.getAttribute('data-sidebar');
    document.querySelectorAll('.panel-overlay').forEach(function(p){ p.classList.add('hidden'); });
    document.querySelectorAll('.st-tab').forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    if(target==='shopOverlay') renderShop();
    else if(target==='prestigeOverlay') renderPrestige();
    else if(target==='collectionOverlay') renderCollection();
    else if(target==='achievementOverlay') renderAchievements();
    openPanel(target);
  });
});

/* =========================================================
   INICIALIZAÇÃO
========================================================= */
load();
recomputeStats();
lastRankStep = getRankStep(state.diamonds);
updateHUD();
setInterval(save, 10000);
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });
requestAnimationFrame(function(t){ lastTime = t; requestAnimationFrame(loop); });

/* Desktop: auto-abre loja na sidebar se nenhum painel estiver visível */
if(window.innerWidth >= 1024 && document.getElementById('offlineOverlay').classList.contains('hidden')){
  renderShop();
  openPanel('shopOverlay');
}

})();
</script>
<script>
/* PWA: botão de instalação (beforeinstallprompt + iOS manual) */
(function () {
  var banner = document.getElementById('installBanner');
  var text = banner.querySelector('.ib-text');
  var btn = document.getElementById('btnInstall');
  var close = document.getElementById('btnInstallClose');
  var KEY = 'bmc_install_dismissed';
  var dismissed = localStorage.getItem(KEY) === '1';
  var deferred = null;
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

  function hide() { banner.style.display = 'none'; }
  function show() { if (!dismissed && !standalone) banner.style.display = 'flex'; }
  function dismiss() { dismissed = true; localStorage.setItem(KEY, '1'); hide(); }

  if (standalone) { hide(); return; }

  /* iOS/Safari não dispara beforeinstallprompt: instrução manual */
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) {
    text.textContent = 'IOS: TOQUE EM COMPARTILHAR E DEPOIS "ADICIONAR À TELA DE INÍCIO"';
    btn.textContent = 'OK';
    btn.addEventListener('click', dismiss);
    close.addEventListener('click', dismiss);
    show();
    return;
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    show();
  });
  window.addEventListener('appinstalled', function () {
    deferred = null;
    hide();
  });

  btn.addEventListener('click', function () {
    if (!deferred) { dismiss(); return; }
    deferred.prompt();
    deferred.userChoice.then(function (choice) {
      if (choice.outcome !== 'accepted') dismissed = true, localStorage.setItem(KEY, '1');
      deferred = null;
      hide();
    });
  });
  close.addEventListener('click', function () {
    if (deferred) { deferred = null; }
    dismiss();
  });
})();
</script>
<script>
/* PWA: registra o service worker (cache/offline) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('Service Worker não registrado:', err);
    });
  });
}
